<div class="container">

  <h1>
    Historical Weather Dashboard
  </h1>

  <div class="filter-panel">

    <div>

      <label>
        From Date
      </label>

      <input
        type="date"
        [(ngModel)]="fromDate">

    </div>

    <div>

      <label>
        To Date
      </label>

      <input
        type="date"
        [(ngModel)]="toDate">

    </div>

    <div>

      <label>
        Min Temperature
      </label>

      <input
        type="number"
        [(ngModel)]="minTempFilter">

    </div>

    <div>

      <button
        (click)="applyFilters()">

        Apply Filters
      </button>

      <button
        (click)="clearFilters()">

        Clear
      </button>

    </div>

  </div>

  <div
    *ngIf="loading"
    class="loading">

    Loading weather data...

  </div>

  <div
    *ngIf="errorMessage"
    class="error">

    {{ errorMessage }}

  </div>

  <table *ngIf="!loading">

    <thead>

      <tr>

        <th
          (click)="sortByDate()">

          Date ⇅

        </th>

        <th>
          Min Temp
        </th>

        <th
          (click)="sortByTemperature()">

          Max Temp ⇅

        </th>

        <th>
          Precipitation
        </th>

        <th>
          Status
        </th>

      </tr>

    </thead>

    <tbody>

      <tr
        *ngFor="let item of filteredData">

        <td>
          {{ item.date }}
        </td>

        <td>
          {{ item.minTemperature }}
        </td>

        <td>
          {{ item.maxTemperature }}
        </td>

        <td>
          {{ item.precipitation }}
        </td>

        <td>

          <span
            [style.color]="item.status === 'Success'
            ? 'green'
            : 'red'">

            {{ item.status }}

          </span>

        </td>

      </tr>

    </tbody>

  </table>

  <div
    *ngIf="!loading && filteredData.length === 0"
    class="no-records">

    No records found.

  </div>

</div>
